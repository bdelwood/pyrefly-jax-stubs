name: CI

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "4"
      RUSTUP_TOOLCHAIN: nightly
      UV_FROZEN: "1"
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@nightly

      - uses: extractions/setup-just@v4

      - name: Lint and format
        run: just lint

      - name: Check shape contracts
        run: just test

      - name: Build distributions
        run: just build

      - name: Install the wheel outside the checkout
        working-directory: /tmp
        run: |
          uv run --isolated --with "$GITHUB_WORKSPACE"/dist/*.whl \
            --with "pyrefly @ git+https://github.com/facebook/pyrefly.git@a9858989234d9cc9acd1fbaa85b11fa725486000#subdirectory=pyrefly" \
            pyrefly check --config /dev/null "$GITHUB_WORKSPACE"/tests/cases/positive.py
          if uv run --isolated --with "$GITHUB_WORKSPACE"/dist/*.whl \
            --with "pyrefly @ git+https://github.com/facebook/pyrefly.git@a9858989234d9cc9acd1fbaa85b11fa725486000#subdirectory=pyrefly" \
            pyrefly check --config /dev/null "$GITHUB_WORKSPACE"/tests/cases/negative.py; then
            exit 1
          fi
