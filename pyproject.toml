[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrefly-jax-stubs"
version = "0.10.2.1"
description = "JAX type stubs with native Pyrefly tensor-shape tracking"
authors = [{ name = "Brodi Elwood", email = "bdelwood@fas.harvard.edu" }]
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Stubs Only",
]
dependencies = [
  "jax==0.10.2",
  "pyrefly-shape-extensions==1.2.0.dev2",
]

[project.urls]
Homepage = "https://github.com/bdelwood/pyrefly-jax-stubs"
Repository = "https://github.com/bdelwood/pyrefly-jax-stubs"
Issues = "https://github.com/bdelwood/pyrefly-jax-stubs/issues"

[dependency-groups]
dev = ["pyrefly==1.2.0.dev2", "pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
only-include = ["jax-stubs"]

[tool.hatch.build.targets.sdist]
include = ["jax-stubs/", "tests/", "README.md", "LICENSE", "pyrefly.toml", "justfile"]

[tool.ruff]
line-length = 100
extend-exclude = ["jax-stubs/_src/basearray.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
